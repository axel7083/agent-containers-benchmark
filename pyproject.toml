[project]
name = "agent-containers-benchmark"
version = "0.1.0"
description = "Benchmark of coding agents x models on container good practices (Podman)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
meter = ["aiohttp==3.13.2"]

[project.scripts]
acb = "acb.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0", "aiohttp==3.13.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acb", "src/acb_graders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"
