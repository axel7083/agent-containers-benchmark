# Temporary: reproduce the "removing container ... network" teardown error seen in every trial.
name: debug-teardown

on:
  workflow_dispatch:

permissions: {}

jobs:
  repro:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproduce
        run: |
          podman --version
          IMG=docker.io/library/busybox:1.37
          podman pull -q "$IMG"
          podman network create acbnet
          try() { name=$1; shift; podman run -d --name "$name" "$@" "$IMG" sleep 600 >/dev/null; if podman rm -f "$name" >/tmp/$name.log 2>&1; then echo "OK   $name"; else echo "FAIL $name"; fi; }
          try unpriv-custom --network acbnet
          try priv-custom --privileged --network acbnet
          try priv-default --privileged
          try capnet-custom --cap-add NET_ADMIN --network acbnet
          try sysadmin-custom --cap-add SYS_ADMIN --network acbnet
          try priv-custom-nosys --privileged --security-opt systempaths=unconfined --network acbnet
          echo "---- debug rm of a privileged container on a custom network"
          podman run -d --name dbg --privileged --network acbnet "$IMG" sleep 600 >/dev/null
          podman --log-level=debug rm -f dbg 2>&1 | grep -vE 'level=debug msg="(Reading|Using|Initializing|Setting|Found|Cached|Loading|Not|Configured|Called|Successfully loaded)' | tail -40
          echo "---- leftovers"; podman ps -a --format '{{.Names}} {{.Status}}'
