# Temporary: reproduce the "removing container ... network" teardown error seen in every trial.
name: debug-teardown

on:
  workflow_dispatch:

permissions: {}

jobs:
  repro:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reproduce
        shell: bash {0}
        run: |
          podman --version
          IMG=docker.io/library/busybox:1.37
          podman pull -q "$IMG"
          podman network create acbnet
          try() { name=$1; shift; podman run -d --name "$name" "$@" "$IMG" sleep 600 >/dev/null; s=$(date +%s); if podman rm -f -v "$name" >/tmp/$name.log 2>&1; then r=OK; else r=FAIL; fi; echo "$r $name ($(( $(date +%s) - s ))s)"; }
          try custom --network acbnet
          try custom-init --init --network acbnet
          try custom-priv-init --init --privileged --network acbnet
          try custom-stoptimeout0 --stop-timeout 0 --network acbnet
          echo "---- anonymous volume leak (compose-style down: stop, then rm -v)"
          podman volume ls -q | wc -l
          podman run -d --name vol --network acbnet -v /var/lib/containers "$IMG" sleep 600 >/dev/null
          podman stop vol >/dev/null 2>&1; podman rm -v vol 2>&1 | tail -1
          echo "volumes left: $(podman volume ls -q | wc -l)"
          podman run -d --name volinit --init --network acbnet -v /var/lib/containers "$IMG" sleep 600 >/dev/null
          podman stop volinit >/dev/null 2>&1; podman rm -v volinit 2>&1 | tail -1
          echo "volumes left after init variant: $(podman volume ls -q | wc -l)"
