name: pages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch published data
        run: |
          set -euo pipefail
          mkdir -p site/static/data
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C site/static/data
          else
            echo '{"runs": []}' >site/static/data/index.json
          fi
          # Checks, arms, gates and tasks, generated from the sources (never hardcoded in the site).
          PYTHONPATH=src python3 -m acb.cli catalog --out site/static/data/catalog.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build site
        working-directory: site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
