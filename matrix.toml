# Benchmark matrix. Each cell is one harness (pinned version) x one OpenRouter model.
# A shard = cell x arm, running every selected task `trials` times in one CI job.
dataset_version = 1
harbor_version = "0.23.0"
trials = 1
arms = ["implicit", "nudge", "explicit"]
# One CI job (and one capped key) per cell x arm x task: many short jobs run 20 at a time.
# "arm" groups every task of a cell x arm into one longer job.
shard_by = "task"
# Per-shard OpenRouter key cap = trials x tasks x est_cost_per_trial x headroom (min floor).
# est_cost_per_trial: OpenRouter-billed cost per trial measured on the v1 baseline (run 36569276839),
# a number or a per-arm table.
cap_headroom = 1.5
cap_floor_usd = 0.05

# Native pairings use each harness's own default model (per its docs on 2026-09-29), at its default
# effort. OpenCode has no fixed default, so it is the model-agnostic axis (same harness, several models).

[[cells]]
id = "claude-code.opus-5.5"
harness = "claude-code"
version = "2.1.284"
model = "anthropic/claude-opus-5.5"
# Estimated from Haiku 4.5 x 4 (price ratio) until measured.
est_cost_per_trial = { implicit = 0.25, nudge = 0.50, explicit = 1.30 }

[[cells]]
id = "codex.gpt-6-sol"
harness = "codex"
version = "0.159.0"
model = "openai/gpt-6-sol"
# Estimated from gpt-6-luna x 20 (price ratio) until measured.
est_cost_per_trial = { implicit = 0.10, nudge = 0.16, explicit = 0.24 }

[[cells]]
id = "opencode.gpt-6-luna"
harness = "opencode"
version = "1.18.33"
model = "openai/gpt-6-luna"
est_cost_per_trial = { implicit = 0.003, nudge = 0.008, explicit = 0.009 }

[[cells]]
id = "opencode.glm-5.3-flash"
harness = "opencode"
version = "1.18.33"
model = "z-ai/glm-5.3-flash"
est_cost_per_trial = { implicit = 0.005, nudge = 0.018, explicit = 0.024 }

[[cells]]
id = "opencode.deepseek-v4.1-flash"
harness = "opencode"
version = "1.18.33"
model = "deepseek/deepseek-v4.1-flash"
est_cost_per_trial = { implicit = 0.003, nudge = 0.006, explicit = 0.011 }
