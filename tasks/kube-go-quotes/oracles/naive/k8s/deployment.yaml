apiVersion: apps/v1
kind: Deployment
metadata:
  name: quotes
spec:
  selector:
    matchLabels: {app: quotes}
  template:
    metadata:
      labels: {app: quotes}
    spec:
      containers:
        - name: quotes
          image: quay.io/acme/quotes:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              value: "hunter2"
